name: CI

on:
  push:
    branches:
      - main
      - fix/2026-audit
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type-check and validate rules
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Build production artifacts
        run: npm run build

      - name: Smoke-test production server
        env:
          NODE_ENV: production
          PORT: '4173'
        run: |
          node dist/server.cjs > server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:${PORT}/artwork/smoke > smoke-response.html; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server-smoke.log
              exit 1
            fi
            sleep 0.25
          done

          if [ "$ready" -ne 1 ]; then
            cat server-smoke.log
            exit 1
          fi
          grep --quiet '<div id="root"></div>' smoke-response.html

          api_status=$(curl --silent --output api-response.json --write-out '%{http_code}' http://127.0.0.1:${PORT}/api/missing)
          test "$api_status" = '404'
          grep --quiet 'API route not found' api-response.json

          json_status=$(curl --silent --output json-response.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{' \
            http://127.0.0.1:${PORT}/api/detect-canvas-bounds)
          test "$json_status" = '400'
          grep --quiet 'Invalid request payload' json-response.json
