name: CI

on:
  push:
    branches:
      - main
      - fix/2026-audit
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and validate rules
        run: bun run lint

      - name: Run regression tests
        run: bun run test

      - name: Build production artifacts
        run: bun run build

      - name: Smoke-test production server
        env:
          NODE_ENV: production
          PORT: '4173'
        run: |
          node dist/server.cjs > server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:${PORT}/artwork/smoke > smoke-response.html; then
              grep --quiet '<div id="root"></div>' smoke-response.html
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server-smoke.log
              exit 1
            fi
            sleep 0.25
          done

          cat server-smoke.log
          exit 1
