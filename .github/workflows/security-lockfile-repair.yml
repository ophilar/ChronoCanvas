name: One-time security lockfile repair

on:
  push:
    branches: [security/multer-2-5-0-20261105]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatible npm security updates
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only
          audit_status=$?
          set -e
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'security(deps): apply compatible npm audit lockfile repairs'
            git push origin HEAD:security/multer-2-5-0-20261105
          fi
          exit "$audit_status"
