minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: firebase-rules
        name: Firebase rules lint
        entry: npm run lint:rules
        language: system
        files: ^(firestore|storage)\.rules$
        pass_filenames: false
        stages: [pre-commit]
      - id: typecheck
        name: TypeScript typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: tests
        name: Regression tests
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-push]
